# Anvil's pipeline on a GitLab: load Ingot and Anvil on a cold Gendl
# image and work the forge over HTTP (ci/test.lisp says what it does).
# ci.sexp beside this file is the same pipeline in Anvil's own form.

stages:
  - test

variables:
  GIT_DEPTH: "1"
  # Ingot is a repository of its own (clo/ingot); the job unpacks its
  # master into ingot/ here, with curl: the image carries no git.
  # Once Ingot is stable, Ingot itself can fetch it.
  INGOT_ARCHIVE: "https://gitlab.common-lisp.net/clo/ingot/-/archive/master/ingot-master.tar.gz"
  # The runner's tag: this file runs on two GitLabs (the project is
  # mirrored), whose container runners carry different tags.
  RUNNER_TAG: "common-lisp.net"

workflow:
  rules:
    - if: $CI_SERVER_HOST == "gitlab.genworks.com"
      variables:
        RUNNER_TAG: "amd64-docker"
    - when: always

# The same suite on both engines.  The CCL launcher takes CCL's flags; the
# SBCL launcher is a plain SBCL and takes SBCL's.
cold-load-and-smoke:
  stage: test
  image: genworks/gendl:devo-ccl
  tags:
    - $RUNNER_TAG
  script:
    - rm -rf "$CI_PROJECT_DIR/ingot" && curl -fsSL "$INGOT_ARCHIVE" | tar xz -C "$CI_PROJECT_DIR" && mv "$CI_PROJECT_DIR/ingot-master" "$CI_PROJECT_DIR/ingot"
    - cd /opt/gendl
    - ANVIL_DIR="$CI_PROJECT_DIR" INGOT_DIR="$CI_PROJECT_DIR/ingot" ./gdl/program/gdl-ccl -n -b --load "$CI_PROJECT_DIR/ci/test.lisp"

cold-load-and-smoke-sbcl:
  stage: test
  image: genworks/gendl:devo-sbcl
  tags:
    - $RUNNER_TAG
  script:
    - rm -rf "$CI_PROJECT_DIR/ingot" && curl -fsSL "$INGOT_ARCHIVE" | tar xz -C "$CI_PROJECT_DIR" && mv "$CI_PROJECT_DIR/ingot-master" "$CI_PROJECT_DIR/ingot"
    - cd /opt/gendl
    - ANVIL_DIR="$CI_PROJECT_DIR" INGOT_DIR="$CI_PROJECT_DIR/ingot" ./gdl/program/gdl-sbcl --non-interactive --load "$CI_PROJECT_DIR/ci/test.lisp"
